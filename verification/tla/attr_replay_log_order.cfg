\* Must fail: AckedStateSurvivesRestart (#203 broken variant b). Recovery applies 0x200 attribute-update needles in log order while compaction moves the base needle past the update, so the update sees no live target or is overwritten by the copied base needle.
CONSTANTS
  Writers = {"w1"}
  Deleters = {}
  Updaters = {"u1"}
  UseKeyLock = TRUE
  WriteCanFail = FALSE
  RecoverSkipsGaps = TRUE
  DeleteLogsFirst = TRUE
  Streamers = {}
  Relocate = TRUE
  Compactor = TRUE
  FailLeavesRecord = FALSE
  IndexAfterLateFail = TRUE
  CompactWaitsForWriters = TRUE
  Versioning = FALSE
  ClockStepsBack = FALSE
  NullReplay = TRUE
  CondWriters = {}
  CheckCondUnderLock = TRUE
  ReplayAppliesAttrUpdates = TRUE
  AttrReplayByTime = FALSE
  EmitOnCommit = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK AckedStateSurvivesRestart UpdateNeverResurrects
