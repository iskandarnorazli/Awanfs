\* Must fail: AcknowledgedRowsSurvive. The manifest names a segment before it is synced; a crash loses the segment and the rows it held are before the checkpoint.
CONSTANTS
  Rows = {"r1", "r2", "r3"}
  MaxSegs = 4
  MaxCrashes = 1
  SyncSegmentFirst = FALSE
  GcAfterManifestSync = TRUE
  AlternateSlots = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK AcknowledgedRowsSurvive ManifestSurvivesCrash
CHECK_DEADLOCK FALSE
