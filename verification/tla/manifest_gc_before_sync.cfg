\* Must fail: AcknowledgedRowsSurvive. A merge deletes its inputs before its manifest is durable; a crash tears the new manifest and the old one names deleted segments.
CONSTANTS
  Rows = {"r1", "r2", "r3"}
  MaxSegs = 4
  MaxCrashes = 1
  SyncSegmentFirst = TRUE
  GcAfterManifestSync = FALSE
  AlternateSlots = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK AcknowledgedRowsSurvive ManifestSurvivesCrash
CHECK_DEADLOCK FALSE
