# ceph s3-tests configuration for AwanFS (#47). AwanFS has one key pair (IAM is #53), so the
# "alt" and "tenant" users have keys the server does not know: tests that need a second user
# fail, and the ratchet only holds tests that pass.
[DEFAULT]
host = 127.0.0.1
port = 9000
is_secure = False
ssl_verify = False

[fixtures]
bucket prefix = awanfs-{random}-
iam name prefix = awanfs-
iam path prefix = /awanfs/

[s3 main]
display_name = main
user_id = main
email = main@example.com
api_name = default
access_key = AWANFSMAINKEY0000000
secret_key = awanfs-main-secret-for-s3-tests-0000000000

[s3 alt]
display_name = alt
user_id = alt
email = alt@example.com
access_key = AWANFSALTKEY00000000
secret_key = awanfs-alt-secret-not-configured-0000000000

[s3 tenant]
display_name = tenant
user_id = tenant
email = tenant@example.com
access_key = AWANFSTENANTKEY00000
secret_key = awanfs-tenant-secret-not-configured-000000
tenant = tenant

[iam]
email = iam@example.com
user_id = iam
access_key = AWANFSIAMKEY00000000
secret_key = awanfs-iam-secret-not-configured-0000000000
display_name = iam

[iam root]
access_key = AWANFSIAMROOT0000000
secret_key = awanfs-iam-root-secret-not-configured-00000
user_id = iamroot
email = iamroot@example.com

[iam alt root]
access_key = AWANFSIAMALTROOT0000
secret_key = awanfs-iam-alt-root-secret-not-configured-0
user_id = iamaltroot
email = iamaltroot@example.com
