# ceph s3-tests configuration for AwanFS (#47). AwanFS has one key pair until IAM (#53), and
# the suite's fixtures list buckets as every user before each test, so every user here uses the
# main keys. Tests that compare two users can then pass for the wrong reason; when #53 gives
# alt and tenant their own keys, those drop out of the ratchet and are reviewed then.
[DEFAULT]
host = 127.0.0.1
port = 9000
is_secure = False
ssl_verify = False

[fixtures]
bucket prefix = awanfs-{random}-
iam name prefix = awanfs-
iam path prefix = /awanfs/

[s3 main]
display_name = main
user_id = main
email = main@example.com
api_name = default
access_key = AWANFSMAINKEY0000000
secret_key = awanfs-main-secret-for-s3-tests-0000000000

[s3 alt]
display_name = alt
user_id = alt
email = alt@example.com
access_key = AWANFSMAINKEY0000000
secret_key = awanfs-main-secret-for-s3-tests-0000000000

[s3 tenant]
display_name = tenant
user_id = tenant
email = tenant@example.com
access_key = AWANFSMAINKEY0000000
secret_key = awanfs-main-secret-for-s3-tests-0000000000
tenant = tenant

[iam]
email = iam@example.com
user_id = iam
access_key = AWANFSMAINKEY0000000
secret_key = awanfs-main-secret-for-s3-tests-0000000000
display_name = iam

[iam root]
access_key = AWANFSMAINKEY0000000
secret_key = awanfs-main-secret-for-s3-tests-0000000000
user_id = iamroot
email = iamroot@example.com

[iam alt root]
access_key = AWANFSMAINKEY0000000
secret_key = awanfs-main-secret-for-s3-tests-0000000000
user_id = iamaltroot
email = iamaltroot@example.com
