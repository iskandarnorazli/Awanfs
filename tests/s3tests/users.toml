# Users for the ceph s3-tests run (#47, #53, #151). The main user is the root key from the environment;
# alt and tenant live in separate accounts with explicit self-account identity actions (no blanket s3:*).
[[users]]
name = "alt"
account = "alt"
id = "alt"
display_name = "alt"
email = "alt@example.com"
access_key = "AWANFSALTKEY00000000"
secret_key = "awanfs-alt-secret-for-s3-tests-00000000000"
policy = '{"Statement": {"Effect": "Allow", "Action": ["s3:CreateBucket", "s3:DeleteBucket", "s3:ListBucket", "s3:ListAllMyBuckets", "s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:PutBucketCors", "s3:GetBucketCors", "s3:GetObjectAcl", "s3:PutObjectAcl", "s3:GetBucketAcl", "s3:PutBucketAcl", "s3:GetBucketPolicy", "s3:PutBucketPolicy", "s3:DeleteBucketPolicy", "s3:GetBucketPolicyStatus", "s3:GetBucketOwnershipControls", "s3:PutBucketOwnershipControls", "s3:DeleteBucketOwnershipControls", "s3:GetBucketPublicAccessBlock", "s3:PutBucketPublicAccessBlock", "s3:DeleteBucketPublicAccessBlock", "s3:ListBucketMultipartUploads", "s3:ListMultipartUploadParts", "s3:AbortMultipartUpload", "s3:GetObjectTagging", "s3:PutObjectTagging", "s3:DeleteObjectTagging", "s3:GetBucketTagging", "s3:PutBucketTagging", "s3:DeleteBucketTagging"], "Resource": "*"}}'

[[users]]
name = "tenant"
account = "tenant"
id = "tenant"
display_name = "tenant"
email = "tenant@example.com"
access_key = "AWANFSTENANTKEY00000"
secret_key = "awanfs-tenant-secret-for-s3-tests-0000000"
policy = '{"Statement": {"Effect": "Allow", "Action": ["s3:CreateBucket", "s3:DeleteBucket", "s3:ListBucket", "s3:ListAllMyBuckets", "s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:PutBucketCors", "s3:GetBucketCors", "s3:GetObjectAcl", "s3:PutObjectAcl", "s3:GetBucketAcl", "s3:PutBucketAcl", "s3:GetBucketPolicy", "s3:PutBucketPolicy", "s3:DeleteBucketPolicy", "s3:GetBucketPolicyStatus", "s3:GetBucketOwnershipControls", "s3:PutBucketOwnershipControls", "s3:DeleteBucketOwnershipControls", "s3:GetBucketPublicAccessBlock", "s3:PutBucketPublicAccessBlock", "s3:DeleteBucketPublicAccessBlock", "s3:ListBucketMultipartUploads", "s3:ListMultipartUploadParts", "s3:AbortMultipartUpload", "s3:GetObjectTagging", "s3:PutObjectTagging", "s3:DeleteObjectTagging", "s3:GetBucketTagging", "s3:PutBucketTagging", "s3:DeleteBucketTagging"], "Resource": "*"}}'
