name: Metadata index (experiment)

# #207, decision 59, and #26 stage 6: the metadata index at 10M keys, redb as AwanFS used it,
# a segment prototype and the production segments (server/examples/meta_index_bench.rs). No
# baseline: it fails only when the stores did not answer alike or a phase did not run.

on:
  # A new workflow can be dispatched only once it is on the default branch; until then a push
  # to the measurement branch runs it with the default inputs.
  push:
    branches: [ "measure/207-*" ]
    paths:
      - "server/examples/meta_index_bench.rs"
      - "benchmarks/meta_index_report.py"
      - ".github/workflows/bench-metaindex.yml"
  # #26's peak RSS gate on every pull request that changes the metadata store: the `ceiling` job.
  pull_request:
    paths:
      - "server/src/spill.rs"
      - "server/src/segment.rs"
      - "server/src/segment_set.rs"
      - "server/src/meta_compaction.rs"
      - "server/src/manifest.rs"
      - "server/examples/meta_index_bench.rs"
      - "benchmarks/meta_index_ceiling.py"
      - "benchmarks/test_meta_index_ceiling.py"
      - ".github/workflows/bench-metaindex.yml"
  workflow_dispatch:
    inputs:
      keys:
        description: "Keys to insert"
        default: "10000000"
      gets:
        description: "Gets of present keys, and as many of absent ones"
        default: "1000000"
      scans:
        description: "Prefix scans of up to 1000 keys"
        default: "1000"
      writer_keys:
        description: "Keys for the run with 64 writers at once (redb and prod; 0 skips it)"
        default: "200000"
      stores:
        description: "Stores to run (redb, seg, prod, prod@MIB); the report needs redb"
        default: "redb seg prod"

permissions:
  contents: read

jobs:
  # #26: the production store at 10M keys, a random 1% of them read and as many absent keys,
  # stays under a peak RSS ceiling of 120 MiB, about twice the highest measured peak (60.3 MiB
  # building on Windows, run 44550797419). Mapped segments would put every page a lookup touches
  # in the RSS and break it.
  ceiling:
    name: RSS ceiling, 10M keys (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Self-tests
        run: python benchmarks/test_meta_index_ceiling.py
      - name: Build the benchmark
        run: cargo build --locked --release --example meta_index_bench --manifest-path server/Cargo.toml
      - name: Build and query 10M keys, then check the ceiling
        shell: bash
        env:
          DATA: ${{ runner.temp }}/meta-ceiling
        run: |
          set -euo pipefail
          bin=server/target/release/examples/meta_index_bench
          [ -f "$bin.exe" ] && bin="$bin.exe"
          : > ceiling.jsonl
          "$bin" build --store prod --dir "$DATA" --keys 10000000 | tee -a ceiling.jsonl
          "$bin" query --store prod --dir "$DATA" --keys 10000000 --gets 100000 --scans 100 | tee -a ceiling.jsonl
          set +e
          python benchmarks/meta_index_ceiling.py ceiling.jsonl --ceiling-mib 120 | tee ceiling.txt
          code=${PIPESTATUS[0]}
          { echo "### Peak RSS ceiling, 10M keys ($RUNNER_OS)"; echo '```'; cat ceiling.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  bench:
    name: meta index (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Self-tests
        run: python benchmarks/test_meta_index_report.py

      - name: Build the benchmark
        run: cargo build --locked --release --example meta_index_bench --manifest-path server/Cargo.toml

      - name: Run it
        shell: bash
        env:
          KEYS: ${{ inputs.keys || '10000000' }}
          GETS: ${{ inputs.gets || '1000000' }}
          SCANS: ${{ inputs.scans || '1000' }}
          STORES: ${{ inputs.stores || 'redb seg prod' }}
          WRITER_KEYS: ${{ inputs.writer_keys || '200000' }}
          # The runner's temp directory: on Windows it is on the fast disk (D:), see AGENTS.md.
          DATA: ${{ runner.temp }}/meta
        run: |
          set -euo pipefail
          bin=server/target/release/examples/meta_index_bench
          [ -f "$bin.exe" ] && bin="$bin.exe"
          out=results.jsonl
          : > "$out"
          for s in $STORES; do
            "$bin" build --store "$s" --dir "$DATA/$s" --keys "$KEYS" | tee -a "$out"
            if [ "$RUNNER_OS" = "Linux" ]; then
              # A cold open: nothing of the index in the page cache.
              sync && sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches'
              "$bin" query --store "$s" --dir "$DATA/$s" --keys "$KEYS" --gets "$GETS" --scans "$SCANS" \
                | sed 's/"phase":"query"/"phase":"query_cold"/' | tee -a "$out"
            fi
            "$bin" query --store "$s" --dir "$DATA/$s" --keys "$KEYS" --gets "$GETS" --scans "$SCANS" | tee -a "$out"
            case "$s" in
              redb|prod)
                if [ "$WRITER_KEYS" != 0 ]; then
                  "$bin" writers --store "$s" --dir "$DATA/$s-writers" --keys "$WRITER_KEYS" --writers 64 | tee -a "$out"
                fi ;;
            esac
          done
          case " $STORES " in
            *" redb "*) ;;
            *) echo "No redb run: an experiment, no report."; exit 0 ;;
          esac
          set +e
          python benchmarks/meta_index_report.py "$out" --title "Metadata index at $KEYS keys: redb against segments ($RUNNER_OS)" --report meta_index.md
          code=$?
          [ -f meta_index.md ] && cat meta_index.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-index-${{ matrix.os }}
          path: |
            results.jsonl
            meta_index.md
          if-no-files-found: ignore
