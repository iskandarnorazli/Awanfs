name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build and test the server
        run: cargo test --locked --manifest-path server/Cargo.toml
      - name: Release build
        run: cargo build --locked --release --manifest-path server/Cargo.toml
      - name: Benchmark harness self-tests
        run: python benchmarks/test_run_warp_benchmark.py
