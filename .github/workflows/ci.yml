name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build and test the server
        run: cargo test --locked --no-fail-fast --manifest-path server/Cargo.toml
      - name: Spill index at 1.2M keys, peak RSS at most 200 MB (#13, Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: cargo test --locked --release --manifest-path server/Cargo.toml --test metadata_spill_test -- --ignored --nocapture
      - name: Release build
        run: cargo build --locked --release --manifest-path server/Cargo.toml
      - name: Benchmark harness self-tests
        run: python benchmarks/test_run_warp_benchmark.py
      - name: Benchmark tooling self-tests
        run: |
          python benchmarks/test_ratio_check.py
          python benchmarks/test_bench.py
      - name: Local benchmark smoke run (AwanFS only, 1 round of 1 s)
        run: python benchmarks/bench.py --awanfs-only --runs 1 --duration 1 --output bench_smoke.md

  deploy-check:
    name: Dashboard and alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dashboard is valid JSON
        run: python3 -m json.tool deploy/grafana/awanfs-dashboard.json > /dev/null
      - name: No benchmark job writes over a committed measurement
        run: python3 scripts/check_workflow_outputs.py
      - name: promtool check rules
        run: |
          v=3.5.0
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/prom.tgz "https://github.com/prometheus/prometheus/releases/download/v$v/prometheus-$v.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tgz -C /tmp
          /tmp/prometheus-$v.linux-amd64/promtool check rules deploy/prometheus/alerts.yml

  model-check:
    name: Model check (TLA+)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .tmp/tla2tools-1.7.4.jar
          key: tla2tools-1.7.4
      - name: TLC on verification/tla (fixed design must pass; each broken variant must fail)
        run: bash verification/run_tlc.sh

  drive:
    name: Drive the server (aws CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --locked --release --manifest-path server/Cargo.toml
      - name: Journeys (scripts/verify_drive.sh)
        run: bash scripts/verify_drive.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-evidence
          path: verification/evidence/

