name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build and test the server
        run: cargo test --locked --no-fail-fast --manifest-path server/Cargo.toml
      - name: Print CRC32C implementation path
        run: cargo test --locked --manifest-path server/Cargo.toml --test streaming_digest_test test_crc32c_implementation_path -- --nocapture
      - name: Spill index at 1.2M keys, peak RSS at most 200 MB (#13, Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: cargo test --locked --release --manifest-path server/Cargo.toml --test metadata_spill_test -- --ignored --nocapture
      - name: Release build
        run: cargo build --locked --release --manifest-path server/Cargo.toml
      - name: Benchmark harness self-tests
        run: python benchmarks/test_run_warp_benchmark.py
      - name: Benchmark tooling self-tests
        run: |
          python benchmarks/test_ratio_check.py
          python benchmarks/test_bench.py
          python benchmarks/test_market_claims.py
          python benchmarks/test_core_scaling.py
      - name: Local benchmark smoke run (AwanFS only, 1 round of 1 s)
        run: python benchmarks/bench.py --awanfs-only --runs 1 --duration 1 --output bench_smoke.md

  deploy-check:
    name: Dashboard and alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dashboard is valid JSON
        run: python3 -m json.tool deploy/grafana/awanfs-dashboard.json > /dev/null
      - name: No benchmark job writes over a committed measurement
        run: python3 scripts/check_workflow_outputs.py
      - name: State machines (STATE_MACHINES.md and step results)
        run: |
          python3 scripts/test_check_state_machines.py && python3 scripts/check_state_machines.py &&
          python3 scripts/test_check_fsm_driven.py && python3 scripts/check_fsm_driven.py
      - name: Conformance profile matches start_server.sh and workflow
        run: python3 scripts/test_check_profile.py && python3 scripts/check_profile.py
      - name: s3-tests ratchet log self-tests
        run: python3 scripts/test_check_ratchet_log.py
      - name: Feature registry self-tests and check
        run: |
          python3 scripts/test_features.py
          python3 tests/s3tests/test_conformance_map.py
          S3TESTS_COMMIT=$(sed -n 's/^[[:space:]]*S3TESTS_COMMIT=\([0-9a-f]\{40\}\).*/\1/p' .github/workflows/s3-tests.yml)
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/test_s3.py "https://raw.githubusercontent.com/ceph/s3-tests/$S3TESTS_COMMIT/s3tests/functional/test_s3.py"
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/test_headers.py "https://raw.githubusercontent.com/ceph/s3-tests/$S3TESTS_COMMIT/s3tests/functional/test_headers.py"
          python3 scripts/features.py check --ceph-suite /tmp/test_s3.py /tmp/test_headers.py
      - name: Every test removed from passing.txt has a RATCHET_LOG.md row
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          python3 scripts/check_ratchet_log.py "origin/${{ github.base_ref }}"
      - name: promtool check rules
        run: |
          v=3.5.0
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/prom.tgz "https://github.com/prometheus/prometheus/releases/download/v$v/prometheus-$v.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tgz -C /tmp
          /tmp/prometheus-$v.linux-amd64/promtool check rules deploy/prometheus/alerts.yml

  model-check:
    name: Model check (TLA+)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .tmp/tla2tools-1.7.4.jar
          key: tla2tools-1.7.4
      - name: TLC on verification/tla (fixed design must pass; each broken variant must fail)
        run: bash verification/run_tlc.sh

  drive:
    name: Drive the server (aws CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --locked --release --manifest-path server/Cargo.toml
      - name: Journeys (scripts/verify_drive.sh)
        run: bash scripts/verify_drive.sh
      - uses: actions/cache@v4
        id: warp-cache
        with:
          path: .tmp/warp
          key: warp-linux-v1
      - uses: actions/setup-go@v5
        if: steps.warp-cache.outputs.cache-hit != 'true'
        with:
          go-version: stable
          cache: false
      - name: Build MinIO warp
        if: steps.warp-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tmp/warp
          git clone -q --depth 1 https://github.com/minio/warp "$RUNNER_TEMP/warp-src"
          (cd "$RUNNER_TEMP/warp-src" && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.tmp/warp/warp" .)
      - name: Drive with MinIO warp (warp put)
        run: |
          set -euo pipefail
          DATA=$(mktemp -d)
          LOG="$RUNNER_TEMP/warp-server.log"
          PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1])')
          PID=""
          cleanup() {
            [ -n "$PID" ] && kill "$PID" 2>/dev/null || true
            [ -n "$PID" ] && wait "$PID" 2>/dev/null || true
            rm -rf "$DATA" "$RUNNER_TEMP/warp-bench"*
          }
          trap cleanup EXIT
          AWANFS_ACCESS_KEY=warpkey AWANFS_SECRET_KEY=warps3secret \
            ./server/target/release/s3-server --port "$PORT" --data-dir "$DATA" >"$LOG" 2>&1 &
          PID=$!
          for _ in $(seq 1 100); do
            if curl -s -o /dev/null "http://127.0.0.1:$PORT/"; then break; fi
            sleep 0.1
          done
          curl -s -o /dev/null "http://127.0.0.1:$PORT/" || { echo "server did not start"; cat "$LOG"; exit 1; }
          if ! .tmp/warp/warp put --host "127.0.0.1:$PORT" --access-key warpkey --secret-key warps3secret \
            --duration 10s --no-color --benchdata "$RUNNER_TEMP/warp-bench"; then
            tail -n 30 "$LOG" || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-evidence
          path: verification/evidence/

