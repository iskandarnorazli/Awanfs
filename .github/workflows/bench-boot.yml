name: Boot from a full replay (experiment)

# #26 (owner decision 2026-11-20, option 3): time to boot a data directory of N objects from a
# full replay of its volumes, and the boot's peak heap and RSS. Dispatched by hand (10M default):
# a 10M-object fill takes a while. Each phase prints a JSON line; the summary carries them. PRs
# run 1M objects.

on:
  # On a PR that changes the benchmark or this workflow, so the change runs before it merges.
  pull_request:
    paths:
      - server/examples/boot_bench.rs
      - .github/workflows/bench-boot.yml
  workflow_dispatch:
    inputs:
      objects:
        description: "Objects to write before booting (or comma-separated list)"
        default: "10000000"
      size:
        description: "Bytes per object"
        default: "64"

permissions:
  contents: read

jobs:
  boot:
    name: boot (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build the benchmark
        run: cargo build --locked --release --example boot_bench --manifest-path server/Cargo.toml

      - name: Fill, then boot twice
        shell: bash
        env:
          OBJECTS: ${{ inputs.objects || (github.event_name == 'pull_request' && '1000000') || '10000000' }}
          SIZE: ${{ inputs.size || '64' }}
          # The runner's temp directory: on Windows it is on the fast disk (D:), see AGENTS.md.
          DATA: ${{ runner.temp }}/boot
        run: |
          set -euo pipefail
          bin=server/target/release/examples/boot_bench
          [ -f "$bin.exe" ] && bin="$bin.exe"
          out=boot.jsonl
          : > "$out"
          for n in ${OBJECTS//,/ }; do
            [ -n "$n" ] || continue
            dir="${DATA}_${n}"
            rm -rf "$dir"
            "$bin" fill --dir "$dir" --objects "$n" --size "$SIZE" | tee -a "$out"
            if [ "$RUNNER_OS" = "Linux" ]; then
              # A cold boot: nothing of the volumes in the page cache.
              sync && sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches'
              "$bin" boot --dir "$dir" --objects "$n" --size "$SIZE" | sed 's/"phase":"boot"/"phase":"boot_cold"/' | tee -a "$out"
            fi
            "$bin" boot --dir "$dir" --objects "$n" --size "$SIZE" | tee -a "$out"
            rm -rf "$dir"
          done
          { echo "## Boot from a full replay ($RUNNER_OS)"; echo; echo '```'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-${{ matrix.os }}
          path: boot.jsonl
          if-no-files-found: ignore
