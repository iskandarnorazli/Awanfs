name: Large objects (experiment)

# benchmarks/large_object_check.py: objects above 4 MiB against AwanFS and MinIO on the same
# GitHub-hosted runner. An experiment with no baseline; it fails only when a phase did not
# measure. Runs on demand, and on pull requests that change the script or this file.

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Object sizes (8MiB,16MiB,64MiB,256MiB,1GiB)"
        default: "16MiB,64MiB,256MiB"
      runs:
        description: "Runs per server"
        default: "3"
      direct_read_min:
        description: "AWAN_DIRECT_READ_MIN for the server: GETs this size and up read with direct I/O (empty: the server's default)"
        default: ""
      server_env:
        description: "More server settings, space separated AWAN_* assignments (AWAN_READ_CHUNK=4MiB AWAN_READ_AHEAD=4)"
        default: ""
  pull_request:
    paths:
      - "benchmarks/large_object_check.py"
      - "benchmarks/relocation_rss.py"
      - ".github/workflows/bench-large.yml"

permissions:
  contents: read

env:
  MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
  MC_RELEASE: RELEASE.2025-08-13T08-35-41Z

jobs:
  large:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /tmp
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build s3-server
        run: cargo build --locked --release --bin s3-server --manifest-path server/Cargo.toml

      - uses: actions/cache@v4
        id: minio-cache
        with:
          path: .tmp/minio
          key: minio-${{ env.MINIO_RELEASE }}-mc-${{ env.MC_RELEASE }}-v1-${{ runner.os }}
      - uses: actions/setup-go@v5
        if: steps.minio-cache.outputs.cache-hit != 'true'
        with:
          go-version: stable
          cache: false
      - name: Fetch MinIO and mc
        if: steps.minio-cache.outputs.cache-hit != 'true'
        # dl.min.io answers 410 for the archived binaries and Docker Hub no longer has minio/minio
        # (checked 2026-11-12), so try quay.io, then build the pinned release from source.
        run: |
          mkdir -p .tmp/minio
          from_image() { # image, path in image, output
            docker pull "$1" >/dev/null 2>&1 || return 1
            id=$(docker create "$1") && docker cp "$id:$2" "$3" && docker rm "$id" >/dev/null
          }
          if ! from_image "quay.io/minio/minio:${MINIO_RELEASE}" /usr/bin/minio .tmp/minio/minio; then
            git clone -q --depth 1 --branch "${MINIO_RELEASE}" https://github.com/minio/minio /tmp/minio-src
            (cd /tmp/minio-src && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.tmp/minio/minio" .)
          fi
          if ! from_image "quay.io/minio/mc:${MC_RELEASE}" /usr/bin/mc .tmp/minio/mc; then
            git clone -q --depth 1 --branch "${MC_RELEASE}" https://github.com/minio/mc /tmp/mc-src
            (cd /tmp/mc-src && commit=$(git rev-parse HEAD) && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/minio/mc/cmd.Version=${MC_RELEASE} -X github.com/minio/mc/cmd.ReleaseTag=${MC_RELEASE} -X github.com/minio/mc/cmd.CommitID=${commit} -X github.com/minio/mc/cmd.ShortCommitID=${commit:0:12}" -o "$GITHUB_WORKSPACE/.tmp/minio/mc" .)
          fi
          chmod +x .tmp/minio/minio .tmp/minio/mc
      - name: MinIO versions
        run: .tmp/minio/minio --version && .tmp/minio/mc --version

      - name: Self-tests
        run: python benchmarks/test_large_object_check.py && python benchmarks/test_relocation_rss.py

      - name: Run the large-object check
        timeout-minutes: 40
        env:
          SIZES: ${{ inputs.sizes || '16MiB,64MiB,256MiB' }}
          RUNS: ${{ inputs.runs || '3' }}
          DIRECT_READ_MIN: ${{ inputs.direct_read_min }}
          SERVER_ENV: ${{ inputs.server_env }}
        run: |
          set +e
          # The server inherits this environment; an empty value means its default.
          if [ -n "$DIRECT_READ_MIN" ]; then export AWAN_DIRECT_READ_MIN="$DIRECT_READ_MIN"; echo "AWAN_DIRECT_READ_MIN=$AWAN_DIRECT_READ_MIN" >> "$GITHUB_STEP_SUMMARY"; fi
          for kv in $SERVER_ENV; do
            case "$kv" in AWAN_*=*) export "$kv"; echo "$kv" >> "$GITHUB_STEP_SUMMARY" ;; *) echo "not an AWAN_ setting: $kv"; exit 2 ;; esac
          done
          python -u benchmarks/large_object_check.py --server-bin server/target/release/s3-server \
            --minio-bin .tmp/minio/minio --mc-bin .tmp/minio/mc \
            --sizes "$SIZES" --runs "$RUNS" \
            --report large_report.md
          code=$?
          [ -f large_report.md ] && cat large_report.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # #185: peak RSS while a 64 MiB streamed PUT is copied to the end of the log, under a 32 MiB
      # budget. After the large-object check and with if: always(), so neither hides the other.
      - name: Relocation under a memory budget
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          python -u benchmarks/relocation_rss.py --server-bin server/target/release/s3-server \
            --size 64MiB --budget 32MiB --budget-mib 32 --overhead-mib 16 --report relocation_rss.md
          code=$?
          [ -f relocation_rss.md ] && cat relocation_rss.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-report
          path: |
            large_report.md
            relocation_rss.md
          if-no-files-found: ignore
