name: Sync probe (experiment)

# benchmarks/sync_probe.py: what one durable 64 KiB append costs on the runner's disks, without
# the server. Splits a slow PUT into write, flush and file growth. On demand, and on pull
# requests that change the probe.

on:
  workflow_dispatch:
    inputs:
      fill_gib:
        description: "GiB to fill a volume with before measuring it (large_volume_probe.py)"
        default: "10"
  pull_request:
    paths:
      - "benchmarks/sync_probe.py"
      - "benchmarks/put_path_probe.py"
      - "benchmarks/large_volume_probe.py"
      - "benchmarks/test_large_volume_probe.py"
      - "server/examples/bare_listeners.rs"
      - "server/tests/commit_cost_probe.rs"
      - ".github/workflows/probe-sync.yml"

permissions:
  contents: read

env:
  MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The large-volume step stores 10 GiB twice; with a sparse volume on Windows the job took
    # 50 minutes (run 44091117402). Allow 90 minutes so building MinIO on a cache miss fits.
    timeout-minutes: 90
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - name: Where the disks are
        shell: bash
        run: |
          echo "temp: ${RUNNER_TEMP}  workspace: ${GITHUB_WORKSPACE}"
          python -c "import tempfile; print('python temp:', tempfile.gettempdir())"
          df -h . "${RUNNER_TEMP}" 2>/dev/null || true
      - name: Run the probe
        shell: bash
        run: |
          mkdir -p .tmp/probe
          python -u benchmarks/sync_probe.py --count 200 \
            --dir "$(python -c 'import tempfile; print(tempfile.gettempdir())')" \
            --dir "$PWD/.tmp/probe" --report sync_probe.md
          cat sync_probe.md >> "$GITHUB_STEP_SUMMARY"

      # The same question through the server: 64 KiB PUTs with and without the commit, and
      # with and without a growing volume file. Data on the runner's temp directory.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build s3-server
        run: cargo build --locked --release --bin s3-server --manifest-path server/Cargo.toml
      - name: Build bare listeners example
        run: cargo build --locked --release --example bare_listeners --manifest-path server/Cargo.toml
      - name: Test bare listeners example
        run: cargo test --locked --manifest-path server/Cargo.toml --example bare_listeners

      - uses: actions/cache@v4
        id: minio-cache
        with:
          path: .tmp/minio
          key: minio-${{ env.MINIO_RELEASE }}-mc-v1-${{ runner.os }}
      - uses: actions/setup-go@v5
        if: steps.minio-cache.outputs.cache-hit != 'true'
        with:
          go-version: stable
          cache: false
      - name: Fetch MinIO and mc
        if: steps.minio-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          mkdir -p .tmp/minio
          from_image() { # image, path in image, output
            [ "$RUNNER_OS" = "Linux" ] || return 1
            docker pull "$1" >/dev/null 2>&1 || return 1
            id=$(docker create "$1") && docker cp "$id:$2" "$3" && docker rm "$id" >/dev/null
          }
          if ! from_image "quay.io/minio/minio:${MINIO_RELEASE}" /usr/bin/minio ".tmp/minio/minio$exe"; then
            git clone -q --depth 1 --branch "${MINIO_RELEASE}" https://github.com/minio/minio "$RUNNER_TEMP/minio-src"
            (cd "$RUNNER_TEMP/minio-src" && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.tmp/minio/minio$exe" .)
          fi
          if ! from_image quay.io/minio/mc:latest /usr/bin/mc ".tmp/minio/mc$exe"; then
            git clone -q --depth 1 https://github.com/minio/mc "$RUNNER_TEMP/mc-src"
            (cd "$RUNNER_TEMP/mc-src" && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.tmp/minio/mc$exe" .)
          fi
          chmod +x ".tmp/minio/minio$exe" ".tmp/minio/mc$exe" || true
      - name: MinIO versions
        shell: bash
        run: |
          exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          ".tmp/minio/minio$exe" --version && ".tmp/minio/mc$exe" --version

      - name: Where a PUT's time goes
        shell: bash
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          bin=server/target/release/s3-server
          [ -f "$bin.exe" ] && bin="$bin.exe"
          python -u benchmarks/put_path_probe.py --server-bin "$bin" --report put_path_probe.md
          cat put_path_probe.md >> "$GITHUB_STEP_SUMMARY"
      - name: What one commit costs at the volume layer
        shell: bash
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          cargo test --locked --release --manifest-path server/Cargo.toml --test commit_cost_probe -- --ignored --nocapture | tee commit_cost.txt
          grep -E '^(Data under|\|)' commit_cost.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Probe self-tests
        run: python benchmarks/test_large_volume_probe.py
      # #248, #320: loopback connect cost across bare std, bare tokio, s3-server, and MinIO.
      - name: Loopback connect cost, bare std and tokio against s3-server and MinIO
        shell: bash
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          bin=server/target/release/s3-server
          bare=server/target/release/examples/bare_listeners
          exe=""
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; bare="$bare.exe"; exe=".exe"; fi
          python -u benchmarks/large_volume_probe.py --server-bin "$bin" \
            --bare-bin "$bare" \
            --minio-bin ".tmp/minio/minio$exe" --mc-bin ".tmp/minio/mc$exe" \
            --connect-only --connect-rounds 3 --report connect_probe.md
          cat connect_probe.md >> "$GITHUB_STEP_SUMMARY"
      # Decision 52: new volumes grow. Does that cost anything once the volume is large?
      - name: A large volume, growing against sparse
        shell: bash
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          FILL_GIB: ${{ inputs.fill_gib || '10' }}
        run: |
          bin=server/target/release/s3-server
          [ -f "$bin.exe" ] && bin="$bin.exe"
          python -u benchmarks/large_volume_probe.py --server-bin "$bin" --fill-gib "$FILL_GIB" --report large_volume_probe.md
          cat large_volume_probe.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-reports-${{ matrix.os }}
          path: |
            sync_probe.md
            put_path_probe.md
            connect_probe.md
            large_volume_probe.md
          if-no-files-found: ignore
