name: Benchmarks on the self-hosted runner

# The only workflow on a self-hosted runner (decision 35): benchmarks that need more than 8
# cores, which GitHub-hosted runners do not have. Everything else, other benchmarks included
# (bench-ratio.yml, bench-full.yml), runs on GitHub-hosted runners. A runner registered with the
# label "bench" (benchmarks/RUNNER.md); manual or weekly; never on pull requests, so no PR code
# runs on that machine. Results: job summary and artifact.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Benchmark mode: standard (ratio + full), market_claims, or all"
        type: choice
        options:
          - standard
          - market_claims
          - all
        default: standard
      profile:
        description: "Market-claims profile (full or community)"
        type: choice
        options:
          - full
          - community
        default: full
      duration:
        description: "Seconds per phase"
        default: "30"
      runs:
        description: "Rounds per server (ratio check)"
        default: "3"
      sizes:
        description: "Object sizes for the full matrix (64KiB,1MiB,1GiB,10GiB). 10GiB needs about 60 GB free and adds a long time"
        default: "64KiB,1MiB,1GiB"
  schedule:
    - cron: "17 18 * * 6" # Sunday 02:17 in Malaysia; skipped if the runner is offline

permissions:
  contents: read

concurrency:
  group: bench-selfhosted
  cancel-in-progress: false

jobs:
  # MinIO and mc for the laptop, built on a hosted Windows runner. MinIO's archived binaries
  # are no longer downloadable, so they are built from source, which needs Go; the laptop has
  # none, and run 43628483789 measured AwanFS alone because of it (RustFS needs mc as well).
  # The self-hosted runner is a Windows machine; a Linux one would need its own build here.
  tools:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
    steps:
      - uses: actions/cache@v4
        id: tools
        with:
          path: .tmp/minio
          key: selfhosted-tools-Windows-${{ env.MINIO_RELEASE }}-v1
      - uses: actions/setup-go@v5
        if: steps.tools.outputs.cache-hit != 'true'
        with:
          go-version: stable
          cache: false
      - name: Build MinIO and mc from source (pinned release)
        if: steps.tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .tmp/minio
          git clone -q --depth 1 --branch "$MINIO_RELEASE" https://github.com/minio/minio "$RUNNER_TEMP/minio-src"
          (cd "$RUNNER_TEMP/minio-src" && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.tmp/minio/minio.exe" .)
          git clone -q --depth 1 https://github.com/minio/mc "$RUNNER_TEMP/mc-src"
          (cd "$RUNNER_TEMP/mc-src" && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.tmp/minio/mc.exe" .)
      - uses: actions/upload-artifact@v4
        with:
          name: minio-windows
          path: .tmp/minio
          retention-days: 3

  bench:
    needs: tools
    runs-on: [ self-hosted, bench ]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: minio-windows
          path: .tmp/minio
      - name: MinIO and mc are here
        run: python -c "import os,sys; m=[f for f in ('minio.exe','mc.exe') if not os.path.isfile(os.path.join('.tmp','minio',f))]; print('missing:', m) if m else print('minio.exe and mc.exe are in .tmp/minio'); sys.exit(1 if m else 0)"
      - name: Machine (more than 8 cores, or this belongs on a hosted runner)
        shell: python
        run: |
          import os, platform, sys
          n = os.cpu_count() or 0
          print(platform.platform(), n, "CPUs")
          if n <= 8:
              sys.exit(f"{n} CPUs: this workflow is for benchmarks that need more than 8 cores; use bench-ratio.yml or bench-full.yml on hosted runners")
      # Both reports go to this run's own files, which the run removes first, and never into
      # measurements/: a report step with "if: always()" prints whatever is at its path, so a
      # job that measured nothing would otherwise print a committed report as its own output
      # (that happened in run 43398517562; see bench-full.yml).
      - name: Ratio check against MinIO (builds the server, fetches MinIO if missing)
        if: ${{ !cancelled() && inputs.mode != 'market_claims' }}
        timeout-minutes: 120
        run: |
          python -c "import os; os.path.exists('selfhosted_ratio.md') and os.remove('selfhosted_ratio.md')"
          python -u benchmarks/bench.py --runs ${{ inputs.runs || '3' }} --duration ${{ inputs.duration || '30' }} --output selfhosted_ratio.md
      # Every command here must mean the same in PowerShell and in bash: the runner is a
      # Windows laptop, whose default shell is PowerShell, where "rm -f" is an error (run
      # 43599616475 stopped on it before measuring anything). File work goes through python.
      - name: RustFS (the pinned release, when it is not already in .tmp/rustfs)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python benchmarks/fetch_rustfs.py
      - name: What a durable append costs on this machine's disk
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -u benchmarks/sync_probe.py --count 100 --report selfhosted_probe.md
      # Runs even when the ratio check failed: the two measure different things.
      - name: Full matrix (AwanFS, MinIO, RustFS where present)
        if: ${{ !cancelled() && inputs.mode != 'market_claims' }}
        timeout-minutes: 180
        run: |
          python -c "import os; os.path.exists('selfhosted_full.md') and os.remove('selfhosted_full.md')"
          python -u benchmarks/run_warp_benchmark.py --sizes ${{ inputs.sizes || '64KiB,1MiB,1GiB' }} --concurrent 64 --duration ${{ inputs.duration || '30' }}s --output selfhosted_full.md
      - name: Market claims benchmark (synced writes, cold reads, 4-dir MinIO, spread)
        if: ${{ !cancelled() && (inputs.mode == 'market_claims' || inputs.mode == 'all') }}
        timeout-minutes: 240
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          python -c "import os; p=os.path.join(os.environ['RUNNER_TEMP'],'selfhosted_market_claims.md'); os.path.exists(p) and os.remove(p)"
          python -u benchmarks/market_claims.py --build --profile ${{ inputs.profile || 'full' }} --runs ${{ inputs.runs || '3' }} --duration ${{ inputs.duration || '30' }} --output ${{runner.temp}}/selfhosted_market_claims.md
      - name: Report
        if: always()
        shell: python
        run: |
          import os
          out = os.environ["GITHUB_STEP_SUMMARY"]
          mc_path = os.path.join(os.environ.get("RUNNER_TEMP", ""), "selfhosted_market_claims.md")
          wrote = False
          for p in ("selfhosted_probe.md", "selfhosted_ratio.md", "selfhosted_full.md", mc_path):
              if p and os.path.exists(p) and os.path.getsize(p) > 0:
                  text = open(p, encoding="utf-8").read()
                  print(text)
                  open(out, "a", encoding="utf-8").write(text + "\n\n")
                  wrote = True
          if not wrote:
              msg = ("This run measured nothing: neither selfhosted_ratio.md, "
                     "selfhosted_full.md, nor selfhosted_market_claims.md was written. "
                     "The committed measurements/ files are from other machines and are not this run's output.")
              print(msg)
              open(out, "a", encoding="utf-8").write(msg + "\n")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-selfhosted
          path: |
            selfhosted_probe.md
            selfhosted_ratio.md
            selfhosted_full.md
            ${{ runner.temp }}/selfhosted_market_claims.md
          if-no-files-found: warn
