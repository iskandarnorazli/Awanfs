name: Benchmarks on the self-hosted runner

# The only workflow on a self-hosted runner (decision 35): benchmarks that need more than 8
# cores, which GitHub-hosted runners do not have. Everything else, other benchmarks included
# (bench-ratio.yml, bench-full.yml), runs on GitHub-hosted runners. A runner registered with the
# label "bench" (benchmarks/RUNNER.md); manual or weekly; never on pull requests, so no PR code
# runs on that machine. Results: job summary and artifact.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds per phase"
        default: "30"
      runs:
        description: "Rounds per server (ratio check)"
        default: "3"
  schedule:
    - cron: "17 18 * * 6" # Sunday 02:17 in Malaysia; skipped if the runner is offline

permissions:
  contents: read

concurrency:
  group: bench-selfhosted
  cancel-in-progress: false

jobs:
  bench:
    runs-on: [ self-hosted, bench ]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Machine (more than 8 cores, or this belongs on a hosted runner)
        shell: python
        run: |
          import os, platform, sys
          n = os.cpu_count() or 0
          print(platform.platform(), n, "CPUs")
          if n <= 8:
              sys.exit(f"{n} CPUs: this workflow is for benchmarks that need more than 8 cores; use bench-ratio.yml or bench-full.yml on hosted runners")
      # Both reports go to this run's own files, which the run removes first, and never into
      # measurements/: a report step with "if: always()" prints whatever is at its path, so a
      # job that measured nothing would otherwise print a committed report as its own output
      # (that happened in run 43398517562; see bench-full.yml).
      - name: Ratio check against MinIO (builds the server, fetches MinIO if missing)
        timeout-minutes: 120
        run: |
          rm -f selfhosted_ratio.md
          python -u benchmarks/bench.py --runs ${{ inputs.runs || '3' }} --duration ${{ inputs.duration || '30' }} --output selfhosted_ratio.md
      - name: Full matrix (AwanFS, MinIO, RustFS where present)
        timeout-minutes: 180
        run: |
          rm -f selfhosted_full.md
          python -u benchmarks/run_warp_benchmark.py --sizes 64KiB,1MiB,1GiB --concurrent 64 --duration ${{ inputs.duration || '30' }}s --output selfhosted_full.md
      - name: Report
        if: always()
        shell: python
        run: |
          import os
          out = os.environ["GITHUB_STEP_SUMMARY"]
          wrote = False
          for p in ("selfhosted_ratio.md", "selfhosted_full.md"):
              if os.path.exists(p) and os.path.getsize(p) > 0:
                  text = open(p, encoding="utf-8").read()
                  print(text)
                  open(out, "a", encoding="utf-8").write(text + "\n\n")
                  wrote = True
          if not wrote:
              msg = ("This run measured nothing: neither selfhosted_ratio.md nor "
                     "selfhosted_full.md was written. The committed measurements/ files are "
                     "from other machines and are not this run's output.")
              print(msg)
              open(out, "a", encoding="utf-8").write(msg + "\n")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-selfhosted
          path: |
            selfhosted_ratio.md
            selfhosted_full.md
          if-no-files-found: warn
