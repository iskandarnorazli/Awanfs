name: Docker image

# Builds the image, smoke-tests it (health, PUT and GET with the aws CLI's signing keys and
# with --allow-anonymous off, a clean stop), and on a v* tag pushes it to ghcr.io (#49).
# Also checks the systemd unit with systemd-analyze verify.

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/docker.yml"
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t awanfs:test .
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name awanfs -p 9000:9000 -e AWANFS_ACCESS_KEY=smokekey -e AWANFS_SECRET_KEY=smokesecret awanfs:test
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:9000/_awanfs/health/ready && break; sleep 0.2; done
          curl -sf http://127.0.0.1:9000/_awanfs/health/ready
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:9000/unsigned); [ "$code" = 403 ]
          export AWS_ACCESS_KEY_ID=smokekey AWS_SECRET_ACCESS_KEY=smokesecret AWS_DEFAULT_REGION=us-east-1
          aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket smoke-bkt
          echo "hello from the image" > /tmp/in.txt
          aws --endpoint-url http://127.0.0.1:9000 s3api put-object --bucket smoke-bkt --key k --body /tmp/in.txt
          docker stop -t 30 awanfs
          [ "$(docker inspect -f '{{.State.ExitCode}}' awanfs)" = 0 ]
          docker start awanfs
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:9000/_awanfs/health/ready && break; sleep 0.2; done
          aws --endpoint-url http://127.0.0.1:9000 s3api get-object --bucket smoke-bkt --key k /tmp/out.txt
          cmp /tmp/in.txt /tmp/out.txt
          docker logs awanfs 2>&1 | tail -5
      - name: systemd unit
        run: systemd-analyze verify --man=no deploy/systemd/awanfs.service 2>&1 | grep -v "Command /usr/local/bin/s3-server is not executable" | tee /tmp/verify.txt; ! grep -qiE "error|unknown" /tmp/verify.txt
      - name: Push to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker tag awanfs:test "$image:${GITHUB_REF_NAME}"
          docker tag awanfs:test "$image:latest"
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:latest"
