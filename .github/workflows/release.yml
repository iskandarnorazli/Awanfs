name: Release

# Builds real s3-server binaries on GitHub-hosted runners (replaces the Windows-only,
# self-hosted "build_release_matrix" job of awan-lang's awan-storage-ci.yml).
# workflow_dispatch: binaries as run artifacts. A pushed tag v*: also a GitHub release.

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    bin: s3-server.exe }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  bin: s3-server }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, bin: s3-server }
          - { os: macos-latest,   target: aarch64-apple-darwin,      bin: s3-server }
    steps:
      - uses: actions/checkout@v4
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --bin s3-server --target ${{ matrix.target }} --manifest-path server/Cargo.toml
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp "server/target/${{ matrix.target }}/release/${{ matrix.bin }}" "out/s3-server-${{ matrix.target }}${{ endsWith(matrix.bin, '.exe') && '.exe' || '' }}"
          cd out && for f in *; do (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") > "$f.sha256"; done; ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: s3-server-${{ matrix.target }}
          path: out/*

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
