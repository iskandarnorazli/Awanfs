[package]
name = "awanfs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
s3_server = { package = "awanfs", path = ".." }
hyper = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["rt"] }

