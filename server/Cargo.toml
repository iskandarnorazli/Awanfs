[package]
name = "s3-server"
version = "0.1.0"
edition = "2021"
authors = ["Iskandar Norazli <111472977+iskandarnorazli@users.noreply.github.com>"]
description = "High-performance S3-compatible object storage server with columnar SoA metadata index and 4096B WORM needle volume"
license = "MIT OR Apache-2.0"

[lib]
name = "s3_server"
path = "src/lib.rs"

[[bin]]
name = "s3-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1.6"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
crc32c = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
parking_lot = "0.12"
redb = "2.1"
reed-solomon-erasure = "6.0"
lru = "0.12"
memmap2 = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1.4"
reqwest = { version = "0.12", features = ["stream"] }
