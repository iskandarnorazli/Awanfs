# AwanFS feature registry (#277): every feature mapped to all tests that prove it.
# `done` means every ceph test the feature owns is in tests/s3tests/passing.txt, or is listed under
# [feature.waits_on] with the unfinished feature it needs; scripts/features.py check enforces it.
# Seeded from tests/s3tests/conformance_map.py, .claude/skills/verify-awanfs/features/README.md,
# server/tests/, and server/fuzz/. Read by scripts/features.py and tests/s3tests/conformance_map.py.

